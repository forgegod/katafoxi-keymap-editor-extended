<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/editor-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZMK Keymap Editor</title>
    <script>
      /* Apply scheme before CSS so the first paint matches preference. */
      ;(function () {
        try {
          var pref = localStorage.getItem('color-scheme-preference')
          var scheme = pref === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.colorScheme = scheme
          document.documentElement.style.colorScheme = scheme
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Sans+Symbols+2&family=Nunito:wght@700&family=Quicksand:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
